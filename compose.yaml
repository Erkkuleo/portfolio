services:
  portfolio-client:
    build: client
    restart: unless-stopped
    ports:
      - 3000:3000
    depends_on:
      - portfolio-server

  portfolio-server:
    build: server
    restart: unless-stopped
    volumes:
      - ./server:/app
    ports:
      - 8000:8000
    env_file:
      - project.env
    depends_on:
      - portfolio-database

  portfolio-database:
    container_name: postgresql_database
    image: postgres:17.5
    restart: unless-stopped
    env_file:
      - project.env

  database-migrations:
    image: flyway/flyway:11.10
    env_file:
      - project.env
    depends_on:
      - portfolio-database
    volumes:
      - ./database-migrations:/flyway/sql
    command: -connectRetries=60 -baselineOnMigrate=true migrate

  e2e-tests:
    entrypoint: "/bin/true"
    build: e2e-tests
    network_mode: host
    depends_on:
      - portfolio-client
    volumes:
      - ./e2e-tests/tests:/app/tests